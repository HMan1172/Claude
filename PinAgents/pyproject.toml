[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinagents"
version = "0.1.0"
description = "Multi-agent LLM framework for running a Pinterest affiliate account"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "pillow>=10.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
pinagents = "cli.main:main"

[tool.setuptools.packages.find]
include = ["pinagents*", "cli*"]
